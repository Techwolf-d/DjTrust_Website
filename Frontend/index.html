<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/New_round.png" />
    <link rel="shortcut icon" type="image/png" href="/New_round.png" />
    <link rel="apple-touch-icon" href="/New_round.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>D.J. Trust - Trusted Motorcycle & Vehical Loans in Sri Lanka | D.J. Trust</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script>
      // Runtime API Base URL Configuration:
      // In production over HTTPS, the application uses relative '/api' so IIS ARR reverse-proxies
      // calls to the backend without Mixed Content errors.
      // window.__API_BASE_URL__ = '/api';
    </script>
    <script>
      window.addEventListener('error', function(e) {
        console.error('GLOBAL ERROR:', e);
        var r = document.getElementById('root');
        if (r) {
          r.innerHTML = '<div style="color:#b91c1c;background:#fef2f2;border:2px solid #ef4444;border-radius:12px;padding:24px;margin:24px;font-family:sans-serif;">' +
            '<h2 style="font-weight:bold;margin-bottom:8px;">Runtime Error Detected:</h2>' +
            '<pre style="white-space:pre-wrap;background:#fff;padding:16px;border-radius:8px;border:1px solid #fca5a5;">' + (e.error ? (e.error.stack || e.error.message) : e.message) + '</pre>' +
            '</div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('PROMISE REJECTION:', e);
        var r = document.getElementById('root');
        if (r) {
          r.innerHTML = '<div style="color:#b91c1c;background:#fef2f2;border:2px solid #ef4444;border-radius:12px;padding:24px;margin:24px;font-family:sans-serif;">' +
            '<h2 style="font-weight:bold;margin-bottom:8px;">Promise Rejection:</h2>' +
            '<pre style="white-space:pre-wrap;background:#fff;padding:16px;border-radius:8px;border:1px solid #fca5a5;">' + (e.reason ? (e.reason.stack || e.reason) : 'Unknown') + '</pre>' +
            '</div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
