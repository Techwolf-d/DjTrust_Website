        style="font-family: Arial, sans-serif; font-weight: 900; font-size: 280px; fill: #003d8f;">Dj</text>
        
  <!-- Small Red Dot from brand identity -->
  <circle cx="395" cy="180" r="35" fill="#d32f2f" />
</svg>
